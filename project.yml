name: OmniChat
options:
  bundleIdPrefix: online.omniroute.omnichat
  deploymentTarget:
    macOS: "26.0"
packages:
  OmniRouteKit:
    path: Packages/OmniRouteKit
targets:
  OmniChat:
    type: application
    platform: macOS
    sources: [OmniChat]
    dependencies:
      - package: OmniRouteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.omniroute.omnichat
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: OmniChat/OmniChat.entitlements
    info:
      path: OmniChat/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  OmniChatTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OmniChatTests
        optional: true
    dependencies:
      - target: OmniChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  OmniChat:
    build:
      targets:
        OmniChat: all
        OmniChatTests: [test]
    test:
      targets: [OmniChatTests]
